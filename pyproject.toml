[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cgslr-audit"
version = "0.1.0"
description = "Audit utilities for confidence-guided selective LLM re-evaluation"
requires-python = ">=3.10"
license = {text = "Proprietary release candidate"}

[tool.setuptools.packages.find]
where = ["src"]

