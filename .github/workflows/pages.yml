name: Deploy project page

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "prompts/**"
      - "plans/**"
      - "results/recomputed_metrics.json"
      - "scripts/build_site_results.py"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Verify published result data
        run: |
          python3 scripts/build_site_results.py
          git diff --exit-code -- site/results-data.js site/prompt-data.js
      - name: Build cache-safe site
        run: python3 scripts/build_site.py
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
